<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <h1>Fuel Tracker</h1>
  <nav>
    <a class="active" href="?page=form">Add fill-up</a>
    <a href="?page=dashboard">Dashboard</a>
  </nav>

  <div class="card">
    <label for="vehicle">Vehicle</label>
    <select id="vehicle"></select>

    <label for="newVehicleName">New vehicle name (optional)</label>
    <input id="newVehicleName" type="text" placeholder="e.g. Skoda Octavia">
    <button type="button" id="addVehicleBtn" style="margin-top:8px;background:#555;">Add vehicle</button>
  </div>

  <div class="card">
    <label for="date">Date</label>
    <input id="date" type="date">

    <label for="odometer">Odometer (total km)</label>
    <input id="odometer" type="number" step="0.01" placeholder="e.g. 199789">

    <label for="liters">Liters added</label>
    <input id="liters" type="number" step="0.01" placeholder="e.g. 63.80">

    <label for="totalPrice">Total price paid</label>
    <input id="totalPrice" type="number" step="0.01" placeholder="e.g. 12690.00">

    <label for="notes">Notes (optional)</label>
    <input id="notes" type="text" placeholder="e.g. full tank, highway">

    <button type="button" id="submitBtn">Save fill-up</button>
    <div id="message"></div>
  </div>

  <script>
    function todayIso() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function showMessage(text, type) {
      var el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    function loadVehicles(selectedId) {
      google.script.run.withSuccessHandler(function (vehicles) {
        var select = document.getElementById('vehicle');
        select.innerHTML = '';
        vehicles.forEach(function (v) {
          var opt = document.createElement('option');
          opt.value = v.id;
          opt.textContent = v.name;
          select.appendChild(opt);
        });
        if (selectedId) select.value = selectedId;
      }).getVehicles();
    }

    document.getElementById('date').value = todayIso();
    loadVehicles();

    document.getElementById('addVehicleBtn').addEventListener('click', function () {
      var name = document.getElementById('newVehicleName').value.trim();
      if (!name) return;
      var btn = this;
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (vehicles) {
          btn.disabled = false;
          document.getElementById('newVehicleName').value = '';
          var newest = vehicles[vehicles.length - 1];
          loadVehicles(newest && newest.id);
          showMessage('Vehicle added.', 'success');
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showMessage(err.message, 'error');
        })
        .addVehicle(name);
    });

    document.getElementById('submitBtn').addEventListener('click', function () {
      var payload = {
        vehicleId: document.getElementById('vehicle').value,
        date: document.getElementById('date').value,
        odometer: document.getElementById('odometer').value,
        liters: document.getElementById('liters').value,
        totalPrice: document.getElementById('totalPrice').value,
        notes: document.getElementById('notes').value
      };
      if (!payload.vehicleId) {
        showMessage('Add or select a vehicle first.', 'error');
        return;
      }
      var btn = this;
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (result) {
          btn.disabled = false;
          showMessage(
            'Saved. Distance: ' + (result.distance || 'n/a') + ' km, Consumption: ' +
            (result.consumption || 'n/a') + ' L/100km', 'success');
          ['odometer', 'liters', 'totalPrice', 'notes'].forEach(function (id) {
            document.getElementById(id).value = '';
          });
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showMessage(err.message, 'error');
        })
        .addFillUp(payload);
    });
  </script>
</body>
</html>
